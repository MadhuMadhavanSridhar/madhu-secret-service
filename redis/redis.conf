# One-time secret store. Memory only, by design (DESIGN.md: "How deletion actually deletes").
bind 0.0.0.0
port 6379
protected-mode yes

# No persistence of any kind.
save ""
appendonly no
dir /data

# Bounded memory; refuse writes rather than evict a live secret silently.
maxmemory 256mb
maxmemory-policy noeviction

# Expire keys promptly.
hz 20
lazyfree-lazy-expire no
lazyfree-lazy-user-del no

timeout 0
tcp-keepalive 60
loglevel notice
